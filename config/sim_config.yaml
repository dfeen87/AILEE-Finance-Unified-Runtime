# Market Microstructure Simulation Configuration
# AILEE Finance Runtime - Selling Pressure Analysis

default_market_settings:
  market_model: "lob"  # Options: "lob" or "impact"
  initial_price: 100.0
  tick_size: 0.01
  min_order_size: 0.1
  impact_coefficient: 0.005  # Used if market_model == "impact"
  order_book_depth_levels: 10

scenarios:
  smooth_adoption:
    name: "Smooth Adoption, Mild Profit-Taking"
    description: "Gradual logistic increase in adoption A(t) with low volatility, measuring baseline selling pressure from profit-taking."
    seed: 42
    T: 1000
    market_model: "lob"
    adoption_curve:
      type: "logistic"
      initial_value: 100.0
      target_value: 250.0
      midpoint: 400
      growth_rate: 0.015
    sentiment:
      baseline: 0.5
      sensitivity_to_adoption: 0.5
    agents:
      bullish_adopters: 80
      profit_takers: 60
      panic_sellers: 40
      liquidity_providers: 40
      arbitrageurs: 40
    initial_allocations:
      bullish_adopters:
        cash: 1000000.0
        inventory: 10000.0
        risk_tolerance: 0.8
      profit_takers:
        cash: 500000.0
        inventory: 8000.0
        profit_target_pct: 0.15
      panic_sellers:
        cash: 300000.0
        inventory: 5000.0
        drawdown_threshold_pct: 0.05
      liquidity_providers:
        cash: 2000000.0
        inventory: 20000.0
        half_spread_pct: 0.005
        max_position: 50000.0
      arbitrageurs:
        cash: 1500000.0
        inventory: 12000.0
        aggression: 0.5

  sudden_shock:
    name: "Sudden Adoption Shock"
    description: "Discrete jump in fundamental value F(t) and adoption A(t), measuring price spike, profit-taking wave, and panic selling response."
    seed: 101
    T: 1000
    market_model: "lob"
    adoption_curve:
      type: "stepwise"
      initial_value: 100.0
      steps:
        - step: 0
          value: 100.0
        - step: 300
          value: 220.0
        - step: 600
          value: 280.0
    sentiment:
      baseline: 0.5
      sensitivity_to_adoption: 0.7
    agents:
      bullish_adopters: 80
      profit_takers: 70
      panic_sellers: 50
      liquidity_providers: 30
      arbitrageurs: 40
    initial_allocations:
      bullish_adopters:
        cash: 1000000.0
        inventory: 10000.0
        risk_tolerance: 0.8
      profit_takers:
        cash: 500000.0
        inventory: 8000.0
        profit_target_pct: 0.12
      panic_sellers:
        cash: 300000.0
        inventory: 5000.0
        drawdown_threshold_pct: 0.04
      liquidity_providers:
        cash: 1500000.0
        inventory: 15000.0
        half_spread_pct: 0.006
        max_position: 40000.0
      arbitrageurs:
        cash: 1500000.0
        inventory: 12000.0
        aggression: 0.6

  over_adoption_liquidity_stress:
    name: "Over-Adoption + Liquidity Stress"
    description: "Very strong adoption demand coupled with severely constrained liquidity providers to evaluate market fragility and severe drawdowns."
    seed: 202
    T: 1000
    market_model: "lob"
    adoption_curve:
      type: "logistic"
      initial_value: 100.0
      target_value: 350.0
      midpoint: 250
      growth_rate: 0.025
    sentiment:
      baseline: 0.6
      sensitivity_to_adoption: 0.8
    agents:
      bullish_adopters: 110
      profit_takers: 80
      panic_sellers: 60
      liquidity_providers: 10
      arbitrageurs: 20
    initial_allocations:
      bullish_adopters:
        cash: 1500000.0
        inventory: 12000.0
        risk_tolerance: 0.9
      profit_takers:
        cash: 600000.0
        inventory: 10000.0
        profit_target_pct: 0.10
      panic_sellers:
        cash: 400000.0
        inventory: 7000.0
        drawdown_threshold_pct: 0.03
      liquidity_providers:
        cash: 500000.0
        inventory: 5000.0
        half_spread_pct: 0.012
        max_position: 15000.0
      arbitrageurs:
        cash: 800000.0
        inventory: 6000.0
        aggression: 0.4

  algorithmic_overreaction:
    name: "Algorithmic Overreaction"
    description: "Aggressive algorithmic arbitrageurs and momentum rules amplifying short-term mispricing, inducing selling cascades and volatile recovery."
    seed: 303
    T: 1000
    market_model: "lob"
    adoption_curve:
      type: "stepwise"
      initial_value: 100.0
      steps:
        - step: 0
          value: 100.0
        - step: 250
          value: 180.0
        - step: 500
          value: 230.0
    sentiment:
      baseline: 0.5
      sensitivity_to_adoption: 0.6
    agents:
      bullish_adopters: 60
      profit_takers: 60
      panic_sellers: 50
      liquidity_providers: 30
      arbitrageurs: 90
    initial_allocations:
      bullish_adopters:
        cash: 800000.0
        inventory: 8000.0
        risk_tolerance: 0.8
      profit_takers:
        cash: 500000.0
        inventory: 8000.0
        profit_target_pct: 0.12
      panic_sellers:
        cash: 300000.0
        inventory: 5000.0
        drawdown_threshold_pct: 0.04
      liquidity_providers:
        cash: 1200000.0
        inventory: 12000.0
        half_spread_pct: 0.008
        max_position: 30000.0
      arbitrageurs:
        cash: 2500000.0
        inventory: 20000.0
        aggression: 0.95

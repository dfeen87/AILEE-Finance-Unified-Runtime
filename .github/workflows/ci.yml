name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import sanity check
        run: |
          python -c "import importlib.util; spec = importlib.util.spec_from_file_location('aille_simulation', 'simulations/aille_simulation.py'); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module); print('Imported simulation module successfully')"

      - name: Audit declared dependency vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt

      - name: Run Python unit and integration tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/
          PYTHONPATH=. python -O -m pytest -q tests/

      - name: Build, install, and relocate CMake SDK consumer
        run: ./scripts/verify_cmake_consumer.sh

      - name: Verify native trust boundaries in Release mode
        run: |
          cmake -S . -B build/trust-boundaries -DCMAKE_BUILD_TYPE=Release -DAILLE_BUILD_TESTS=ON
          cmake --build build/trust-boundaries --parallel 2
          ctest --test-dir build/trust-boundaries --output-on-failure

      - name: Build and run C++ regression suite
        run: |
          ./setup_websocket.sh
          make test_suite
          ./test_suite

      - name: Run deterministic simulation
        run: |
          python simulations/aille_simulation.py

      - name: Validate REST startup, requests, and lifecycle
        run: |
          make -j2 rest_api_server rest_lifecycle_test
          timeout 60 ./rest_lifecycle_test
          python scripts/verify_rest_lifecycle.py
          python -O scripts/verify_rest_lifecycle.py

name: Dependency compatibility endpoints

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pinned-simulation-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - endpoint: baseline
            numpy: '1.24.0'
            pandas: '2.0.0'
            matplotlib: '3.7.0'
            contourpy: '1.0.7'
            click: '8.1.7'
          - endpoint: upgraded
            numpy: '2.2.6'
            pandas: '2.3.3'
            matplotlib: '3.9.0'
            contourpy: '1.3.3'
            click: '8.5.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install exact compatibility endpoint
        run: >-
          python -m pip install
          numpy==${{ matrix.numpy }} pandas==${{ matrix.pandas }}
          matplotlib==${{ matrix.matplotlib }} contourpy==${{ matrix.contourpy }}
          click==${{ matrix.click }} pytest==9.0.3 pyyaml==6.0.3
      - name: Verify binary imports and installed requirements
        run: |
          python -m pip check
          python -c "import numpy, pandas, matplotlib.pyplot, click"
      - name: Verify deterministic contracts
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: '0'
        run: >-
          python -m pytest -q tests/test_dependency_compatibility.py
          tests/test_market_sim.py tests/test_math_engine.py tests/test_math_finance_boundary.py
